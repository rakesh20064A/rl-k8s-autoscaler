# configs/traffic_profiles/v2/constant_memory.yaml
# V2 multi-resource workload set (Part C). New file; does not modify any
# frozen V1 profile. Memory-heavy counterpart to constant_cpu.yaml: same
# traffic shape/RPS/duration, but each request performs bounded memory
# work instead of CPU work (resource_mode=memory skips CPU entirely --
# app/src/workload.py perform_work()).
#
# memory_mb=16 matches the V2 Phase 1.1 safety ceiling MAX_WORK_MEMORY_MB=16
# (app/src/workload.py), recalculated from the pod's actual memory limit
# (k8s/app/deployment.yaml, 256Mi) and the load generator's actual max
# concurrency (DEFAULT_MAX_IN_FLIGHT=50, scripts/traffic_orchestrator.py).
# See the V2 Phase 1.1 report for the full worst-case-concurrency math.

profile: constant_memory
description: "V2: constant medium load, memory-heavy resource mode (CPU work skipped)"
seed: 42

duration_seconds: 600
target_rps: 20
intensity: 3
endpoint: /work

resource_mode: memory
memory_mb: 16

# V2 Phase 2.1 PART 3 (revised live, V2 Phase 2.2 PART 3): explicit,
# profile-specific safety ceiling, tighter than the load generator's
# general --max-in-flight=50 default. Originally set to 10 from an
# analytical estimate; LOWERED to 8 after live measurement through the
# actual loadgen/traffic_generator.py path (not an ad hoc client) showed a
# real peak of ~222.8Mi (87% of the 256Mi limit, only 13% headroom) at
# cap=10 -- too close for comfort given measurement noise and real
# concurrent-connection overhead not captured by the simple per-request
# model. At cap=8: ~60Mi idle + 8*16MB = ~188Mi (73% of the limit), ~27%
# headroom. See loadgen/traffic_generator.py's
# TrafficGenerator.effective_max_in_flight.
memory_safe_max_in_flight: 8
