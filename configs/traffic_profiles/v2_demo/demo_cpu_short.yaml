# configs/traffic_profiles/v2_demo/demo_cpu_short.yaml
# V2 Phase 5E: a SHORT (~8 min) DEMO-ONLY profile for the live UI demo --
# NOT a member of autoscaler.src.rl_env.training_contract_v2.
# V2_TRAINING_PROFILE_ALLOWLIST (constant_cpu, constant_memory,
# constant_mixed, ramp_mixed, burst_mixed) and NOT a member of
# configs/traffic_profiles/v2_eval/'s EVAL_PROFILE_ALLOWLIST
# (eval_cpu_step, eval_memory_ramp, eval_mixed_burst) -- firewalled from
# BOTH the training schedule and the evaluation campaign, by construction
# (different directory, different allowlist constant, see
# tests/unit/test_v2_demo_profiles.py). A demo run using this profile is
# NOT scientific evidence -- it exists only to show the autoscaler
# reacting live during the final presentation, and every view that
# displays its results must label it "DEMO -- not evaluation evidence".
#
# Seed 7001 is used by no training or evaluation profile.

profile: demo_cpu_short
description: "V2 Phase 5E DEMO ONLY (not evaluation evidence): CPU-only, low->high step, ~8 min"
seed: 7001

intensity: 3
endpoint: /work

resource_mode: cpu
memory_mb: 0

phases:
  - type: constant
    name: low
    duration_seconds: 240
    target_rps: 5
  - type: constant
    name: high
    duration_seconds: 240
    target_rps: 18
