# Phase 16U — Direct/Bounded Live-Kubernetes PPO Protocol (FROZEN DESIGN)
#
# classification: OFFLINE_PROTOCOL_FORMALIZATION_ONLY
# No traffic generated, no Kubernetes/HPA mutation, no PPO training, no PPO
# evaluation, no surrogate model refit, no reopening of any consumed
# validation holdout (Iteration-2B/Iteration-3) in this phase.
#
# This document formalizes HOW to execute, on the real live Kubernetes
# cluster, the RL decision problem that is ALREADY FROZEN in
# docs/rl_mdp_spec.md (rl_contract_version: 2, reward_contract_version: 2).
# It does NOT redefine the observation vector, action encoding, reward
# formula, decision interval, or episode contract -- those are cited from
# the frozen contract, unchanged. It DOES freeze everything the frozen
# contract explicitly left to a future phase: live training/evaluation
# timing overhead, workload-set separation, PPO training hyperparameters
# suitable for real-time live interaction, ledger design, and evaluation
# metrics/decision rule.

phase: "16U"
title: "Direct/Bounded Live-Kubernetes PPO Protocol Preregistration"
selected_methodology: "PATH_B_DIRECT_LIVE_KUBERNETES_RL"  # per phase_16t_path_comparison_and_recommendation.md
supersedes_nothing: true
frozen_contract_adopted_unchanged:
  document: "docs/rl_mdp_spec.md"
  rl_contract_version: 2
  reward_contract_version: 2
  note: >
    Phase16U treats this document as authoritative and does not reopen or
    reinterpret it. Any future change to observation/action/reward/episode
    semantics requires its own CORR-N-style correction to
    docs/rl_mdp_spec.md, not a Phase16U edit.

# ---------------------------------------------------------------------------
# 1. Correction to Phase16T's design (per this phase's explicit instruction)
# ---------------------------------------------------------------------------
correction_to_phase16t:
  issue: >
    phase_16t_direct_rl_design.md described using historical Iteration-2B/
    Iteration-3 transitions as an "off-policy replay buffer" for PPO
    warm-start. PPO is an on-policy algorithm (its policy-gradient/clipped
    surrogate objective and GAE advantage estimates require the rollout
    data to have been generated by the current, or near-current, policy).
    Training PPO's on-policy updates from arbitrary historical transitions
    generated by neither HPA nor any PPO policy would be methodologically
    invalid, not merely inefficient.
  correction: >
    Historical Iteration-2B/Iteration-3 data (permanently consumed,
    fitting_weight=0, unchanged) may be used ONLY for the following
    non-evaluative, non-training-loop purposes, each explicitly separated
    from PPO's on-policy rollout/update mechanism:
      1. Observation normalization sanity-checks -- cross-checking that the
         frozen raw clip ranges in docs/rl_mdp_spec.md sec.7/8 (already
         independently derived from Phase-10/CORR-23 evidence) are
         consistent with the empirical (rps, replicas) -> (cpu, memory,
         requests_in_progress, latency) ranges observed in Iterations 2B/3.
         Read-only cross-check; must not change any frozen clip value
         without its own CORR-N correction to docs/rl_mdp_spec.md.
      2. Reward-scale sanity-checks -- computing what the frozen reward
         formula (configs/reward.yaml, unchanged) WOULD have produced for
         historical (rps, replicas) combinations, purely to confirm the
         reward's per-step magnitude range documented in
         docs/rl_mdp_spec.md sec.15 is realistic. Diagnostic only; does not
         feed any gradient update.
      3. Workload-envelope design support for the new final-holdout
         workload (Section 7 / phase_16u_training_and_evaluation_workload_
         split.json) -- informing what RPS range is physically safe and
         supported, without inspecting or reusing the actual held-out
         workload's own parameters (mirrors the discipline already applied
         in docs/rl_mdp_spec.md sec.22 to unseen_eval.yaml).
      4. OPTIONAL, NOT preregistered here, NOT required: a separately
         justified supervised behavior-cloning initialization of the PPO
         policy network's weights, only if (a) a well-defined label exists
         for each historical state (e.g. "the replica count the canonical
         HPA baseline would have chosen"), (b) this is documented as its
         own labeled pretraining step distinct from and prior to any
         on-policy PPO update, and (c) it is explicitly disclosed in any
         report as a non-standard initialization, never presented as part
         of PPO's on-policy learning signal. This phase does not decide
         whether to use this option -- it is left to the implementation
         phase to justify or skip.
  forbidden: >
    No replay-buffer / off-policy-style training of PPO's policy or value
    network from historical transitions. No re-entry of Iteration-2B/
    Iteration-3 data into any point-accuracy validation gate. No learned
    surrogate simulator introduced merely to bypass the Phase16S failed
    surrogate-validation result.

# ---------------------------------------------------------------------------
# 2 & 3. Observation and action space -- ADOPTED UNCHANGED from the frozen
#         contract, not redesigned by Phase16U.
# ---------------------------------------------------------------------------
observation_space:
  source_of_truth: "docs/rl_mdp_spec.md sec.3-8; configs/rl.yaml observation_v2"
  shape: 11
  dtype: float32
  live_observation_only: true
  surrogate_model_prediction_permitted_in_observation: false
  history_included: true
  history_mechanism: "90s-span EWMA delta for indices 1,5,7 only (cpu_per_replica, request_rate_norm, p95_latency_norm) -- frozen mechanism, sec.5. No additional raw history beyond what sec.5 already specifies is added by Phase16U."

action_space:
  source_of_truth: "docs/rl_mdp_spec.md sec.9; configs/rl.yaml action_space"
  type: "Discrete(3)"
  encoding: {0: "SCALE_DOWN_ONE (-1)", 1: "HOLD (0)", 2: "SCALE_UP_ONE (+1)"}
  hard_replica_range: [1, 8]
  boundary_handling: "clip(current_desired + requested_delta, 1, 8) - current_desired; frozen sec.9"
  cooldown_rule: "asymmetric -- no extra cooldown on scale-up; 60s minimum spacing between effective scale-downs; frozen sec.12"
  pending_scale_gate: "non-HOLD action becomes effective HOLD while a prior transition has not fully realized (desired != ready); frozen sec.12 rule 1"
  repeated_noop_allowed: true
  minimum_time_before_another_scaling_decision: "governed entirely by sec.12's pending-scale gate and scale-down cooldown, not by a separate new timer"

# ---------------------------------------------------------------------------
# 4. Decision timing and episode structure
# ---------------------------------------------------------------------------
timing:
  decision_interval_seconds: 30       # frozen, docs/rl_mdp_spec.md sec.1
  pre_episode_stabilization_seconds: 60  # frozen, sec.20 reset sequence
  episode_definition: "one full traffic-profile execution, t=0 to that profile's total scheduled duration -- frozen, sec.20. Not shortened or cropped by Phase16U."
  decisions_per_training_episode_by_profile:
    constant: 20    # 600s / 30s
    step: 30        # 900s / 30s
    burst: 40       # 1200s / 30s
    ramp: 40        # 1200s / 30s
    periodic: 60    # 1800s / 30s
    mixed: 80       # 2400s / 30s
  inter_episode_restoration:
    ppo_controlled_episodes:
      mechanism: "direct Deployment replica patch to initial_replicas=1 (NOT via HPA -- PPO episodes run with the HPA object absent, mirroring the isolation discipline already used during Iteration-2B/3 calibration)"
      justification_for_deviating_from_the_calibration-harness's_HPA-throttled_restoration_wait: >
        NEW METHODOLOGY CHOICE, safety-reviewed here: the existing
        restoration_wait_seconds() formula (dynamics_calibration_lib.py) is
        long (120 + 60*steps + 30, up to 570s) because it waits out HPA's
        OWN throttled scale-down behavior (-1 pod per 60s,
        k8s/hpa/hpa.yaml). A PPO training episode's own reset does not go
        through HPA at all -- it is a direct Deployment patch to
        replicas=1 -- so it is governed only by normal pod-termination
        time, not by an artificial per-minute throttle.
      bounded_max_wait_seconds: 120
      on_timeout: "RESTORATION_TIMEOUT: stop the training loop for manual inspection; never proceed to the next episode on an unconfirmed reset state; never silently retry indefinitely."
      confirmation_required: "ready_replicas == 1 confirmed before the next episode's pre-episode stabilization window begins"
    hpa_controlled_evaluation_episodes:
      mechanism: "unchanged existing calibration-harness procedure: restoration_wait_seconds() / _restore_hpa_and_idle(), since here HPA genuinely governs the scale-down pacing"
      bounded_max_wait_seconds: 570   # replicas=8 worst case, existing formula

# ---------------------------------------------------------------------------
# 5. Reward -- see phase_16u_reward_specification.yaml (restates the frozen
#    configs/reward.yaml formula verbatim; Phase16U tunes nothing).
# ---------------------------------------------------------------------------
reward_specification_file: "phase_16u_reward_specification.yaml"

# ---------------------------------------------------------------------------
# 6. PPO configuration -- see phase_16u_ppo_hyperparameters.json
# ---------------------------------------------------------------------------
ppo_hyperparameters_file: "phase_16u_ppo_hyperparameters.json"

# ---------------------------------------------------------------------------
# 7. Training vs. final evaluation separation -- see
#    phase_16u_training_and_evaluation_workload_split.json
# ---------------------------------------------------------------------------
workload_split_file: "phase_16u_training_and_evaluation_workload_split.json"

# ---------------------------------------------------------------------------
# 8. Training budget (see phase_16u_ppo_hyperparameters.json for the exact
#    total_timesteps/n_steps values; summarized here for wall-clock context)
# ---------------------------------------------------------------------------
training_budget_summary:
  total_environment_steps: 12288
  approx_decision_time_hours: 102.4      # 12288 * 30s
  approx_episode_overhead_hours: 13.65   # ~273 episodes * ~180s reset/restore
  approx_periodic_dev_validation_overhead_hours: 2.6   # 12 checks * ~780s
  approx_total_wall_clock_hours: 118.6   # ~4.94 days of continuous live cluster time
  feasibility_disclosure: >
    configs/rl.yaml's existing training.total_timesteps=500000 and
    ppo.n_steps=2048 are sized for a fast, non-real-time SIMULATED backend
    (ScriptedBackend) where an environment step costs milliseconds, not a
    real 30-second live decision interval. Used literally against a live
    cluster, 500000 steps would require ~173 days of pure decision time
    alone (before any episode-reset overhead), which is not feasible on
    this project's M1/8GB, single-machine, single-cluster environment
    within a BTech capstone timeline. Phase16U therefore freezes a
    deliberately reduced live-training budget (12288 steps, ~118.6 hours,
    achievable across roughly 1-2 weeks of caffeinate-protected
    multi-day/overnight continuous runs, mirroring the precedent already
    established in Phase16Q's caffeinate-protected unattended live
    collection). This is disclosed honestly as ~40x smaller than the
    original simulated-backend design target. Whether PPO learns a
    materially non-trivial, better-than-random policy within this reduced
    budget is an OPEN EMPIRICAL QUESTION the implementation phase must
    report honestly -- including as a negative finding if it does not --
    never masked by silently extending training beyond this frozen budget
    or by changing the evaluation metric after seeing results.
  multi_seed_training_not_feasible: >
    configs/rl.yaml lists training.seeds=[42,7,123] (3 seeds), designed
    for a fast simulated backend where 3x the compute is cheap. Live
    3-seed training would require ~3x118.6 ~= 356 hours (~14.8 days) of
    continuous cluster time, judged infeasible for this capstone. Phase16U
    freezes a SINGLE live training seed (42, matching most existing
    traffic-profile seeds) and discloses multi-seed training as a
    limitation, not a silently dropped requirement.

# ---------------------------------------------------------------------------
# 9. Baselines
# ---------------------------------------------------------------------------
baselines:
  primary_required:
    - name: "PPO"
      controller: "trained policy from this protocol"
    - name: "HPA"
      controller: "canonical HPA"
      configuration: {target_cpu_utilization_percent: 260, min_replicas: 1, max_replicas: 8}
      configuration_source: "k8s/hpa/hpa.yaml, configs/hpa.yaml -- UNCHANGED, canonical since Phase 11C.4P/CORR-26"
  optional_diagnostic_not_a_substitute_for_the_required_comparison:
    - name: "static_fixed_replica_4"
      purpose: "diagnostic reference point only (midpoint of the 1-8 range); does not replace the required PPO-vs-HPA comparison"
      repeats: 1
  co_control_forbidden: "PPO and HPA never control the same Deployment simultaneously -- HPA object is absent during PPO-controlled episodes, exactly as during Iteration-2B/3 calibration's own HPA object-lifecycle isolation."
  fail_closed_check: "if a live HPA object targeting the same Deployment is detected at PPO-controller start, refuse to start -- frozen, docs/rl_mdp_spec.md sec.13 table."

# ---------------------------------------------------------------------------
# 10. Final comparison metrics and decision rule (frozen BEFORE any
#     evaluation episode runs)
# ---------------------------------------------------------------------------
evaluation_metrics:
  per_episode_metrics:
    - id: "sla_violation_rate"
      definition: "fraction of decision steps in the episode with p95_latency_seconds > 0.300 (sla.p95_latency_ms, configs/experiment.yaml)"
      direction: "lower is better"
    - id: "error_rate_mean"
      definition: "mean per-step 5xx error_rate_rps / request_rate_rps (0 if request_rate_rps==0)"
      direction: "lower is better"
    - id: "resource_proxy_mean"
      definition: "mean per-step (deployment_current_replicas - 1) / 7 -- same quantity as the reward's own R_resource term, for direct comparability"
      direction: "lower is better, at matched SLA performance"
    - id: "reaction_time_seconds"
      definition: "for each SLA-breach onset (p95 crosses above 300ms from below), seconds until the first EFFECTIVE scale-up action; averaged across breach onsets in the episode; undefined (excluded) if no breach occurs"
      direction: "lower is better"
    - id: "action_churn_count"
      definition: "count of EFFECTIVE non-HOLD actions in the episode"
      direction: "diagnostic only, not part of the win/loss decision rule"
  aggregation: "descriptive statistics (mean, min, max) across the 3 repeats per controller on the identical final held-out workload; raw per-repeat values always reported alongside the aggregate, never only the mean"
  decision_rule: >
    FROZEN NOW, before any evaluation episode runs. With n=3 repeats per
    controller, no formal statistical-significance test is claimed or
    computed (sample size does not support one). A controller is reported
    as "descriptively better" ONLY if it has equal-or-better
    sla_violation_rate AND equal-or-better resource_proxy_mean in EVERY ONE
    of the 3 repeats (a conservative, non-inferential rule). If this
    condition holds for neither controller consistently, the result is
    reported as "mixed / no clear winner" -- itself a valid, reportable
    capstone finding, not a failure requiring re-running until a winner
    emerges.
  post_hoc_metric_changes_forbidden: true

# ---------------------------------------------------------------------------
# 11. Reproducibility and ledgers (NEW, dedicated to this protocol --
#     Iteration-3's scientific ledger is never reused for RL episodes)
# ---------------------------------------------------------------------------
ledgers:
  ppo_training_episode_ledger:
    path_convention: "persistent-data/rl_training/ppo_training_episode_ledger.json (to be created by the implementation phase)"
    fields: [episode_id, seed, traffic_profile, profile_hash, n_decision_steps, ppo_update_index, start_utc, end_utc, terminated_or_truncated, termination_reason, safety_events, total_reward, mean_reward_per_step, reward_validity_counts, restoration_wait_seconds, restoration_timed_out, controller_code_hash, config_hash, status]
  ppo_final_evaluation_episode_ledger:
    path_convention: "persistent-data/rl_training/ppo_final_evaluation_ledger.json"
    fields: [episode_id, repeat_index, held_out_workload_hash, seed, start_utc, end_utc, per_episode_metrics, safety_events, terminated_or_truncated, controller_code_hash, config_hash, status]
  hpa_final_evaluation_episode_ledger:
    path_convention: "persistent-data/rl_training/hpa_final_evaluation_ledger.json"
    fields: [episode_id, repeat_index, held_out_workload_hash, start_utc, end_utc, per_episode_metrics, hpa_config_hash, status]
  common_requirements:
    - "every episode gets exactly one ledger row; no silent overwrite of a completed row"
    - "safety-gate refusals and restoration timeouts are recorded as events, never discarded or retried silently"
    - "config/code hashes recorded per episode so a later audit can detect any mid-campaign drift, mirroring the Iteration-3 ledger's own governing-hash-verification discipline"
    - "no episode may be retried for being scientifically inconvenient; a structurally-failed attempt (e.g. RESTORATION_TIMEOUT, prometheus_unavailable persisting) is preserved, not deleted, exactly as Iteration-3's non-official-attempt preservation discipline required"

# ---------------------------------------------------------------------------
# 12. Implementation boundary
# ---------------------------------------------------------------------------
implementation_boundary:
  this_phase_writes_no_ppo_or_environment_code: true
  this_phase_runs_no_live_episode: true
  what_a_future_implementation_phase_must_still_produce:
    - "a live-cluster DynamicsBackend implementing autoscaler/src/rl_env/backend.py's existing DynamicsBackend protocol, wired to real Prometheus queries and real Deployment patches (today only ScriptedBackend exists)"
    - "the three ledgers defined in Section 11"
    - "the new final-holdout traffic-profile YAML, generated per phase_16u_training_and_evaluation_workload_split.json's frozen generation parameters, and hash-pinned before first use"
    - "the actual PPO training run against the budget frozen in phase_16u_ppo_hyperparameters.json"
    - "the final PPO-vs-HPA live evaluation campaign per Sections 9-10"
  authorization: "not authorized to begin by this phase; requires separate authorization"
