apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: autoscaler-app
  labels:
    app: demo-app
    project: rl-k8s-autoscaler
spec:
  # Initial replica count — will be controlled by HPA or RL agent during experiments.
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        project: rl-k8s-autoscaler
      annotations:
        # Instruct Prometheus to scrape this pod directly (fallback if ServiceMonitor is not used)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: demo-app
          image: rl-autoscaler-demo-app:local
          # Never pull — image is built locally inside Minikube's Docker daemon.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: demo-app-config

          # Resource requests and limits are mandatory for HPA CPU metrics.
          # CPU utilization = (actual CPU used) / (CPU requested).
          # Without requests, HPA reports "unknown" utilization.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3

          # V2 Phase 4B-R3: a TCP-socket liveness correction was proposed
          # and LIVE-VALIDATED here, but REJECTED and reverted -- it
          # prevented the liveness-restart (confirmed: 0 restarts under the
          # same constant_cpu validation workload) but introduced a WORSE
          # failure mode: with only 1 replica, a sustained-NotReady pod
          # under CPU saturation left the Deployment with ZERO Ready
          # replicas, which metrics-server/HPA explicitly excludes from its
          # CPU sampling ("did not receive metrics for targeted pods, pods
          # might be unready") -- HPA could not scale up AT ALL, and the
          # single pod stayed NotReady (genuine total unavailability) for
          # 4+ continuous minutes with no recovery path, versus the
          # original HTTP-liveness restart's forced reset+recovery cycle.
          # Per this phase's own validation gate ("no sustained zero-ready
          # state" is a required success criterion, not optional), this
          # correction does not meet the bar and was reverted to the
          # original HTTP /health liveness. A different, more carefully
          # designed correction (unrelated to probe TYPE alone) is needed
          # in a future, separately-scoped phase.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3

      # Spread pods across available nodes for realistic multi-pod experiments
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: demo-app
                topologyKey: kubernetes.io/hostname
