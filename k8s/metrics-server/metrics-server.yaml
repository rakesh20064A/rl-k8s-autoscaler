# k8s/metrics-server/metrics-server.yaml
# V2 Phase 5A / CORR-60: a self-managed, permanent replacement for
# Minikube's own `metrics-server` ADDON (which is re-applied with its own
# packaging defaults -- notably --metric-resolution=60s -- on every
# `minikube addons enable metrics-server` / cluster recreation, requiring
# scripts/configure_metrics_server.sh to be re-run every time, as already
# documented in docs/experimental_design_corrections.md). This manifest is
# NOT applied by this phase -- preparation only. Applying it (via
# scripts/apply_metrics_server_permanent.sh, also not run this phase) is a
# future, explicitly-decided action, never automatic.
#
# Namespace, RBAC, Service, and container args are modeled directly on the
# upstream kubernetes-sigs/metrics-server project's own published
# components.yaml (the standard way metrics-server is installed outside of
# a vendor addon), with the SAME live container args this project's cluster
# is already running under today (see scripts/configure_metrics_server.sh
# and persistent-data/knowledge_snapshot_20261107T054233Z/04_live_cluster.md
# for the addon-bundled baseline this preserves):
#   --cert-dir=/tmp
#   --secure-port=4443
#   --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
#   --kubelet-use-node-status-port
#   --kubelet-insecure-tls
#   --metric-resolution=15s   (this project's selected value, CORR note in
#                              docs/experimental_design_corrections.md;
#                              the addon's own packaged default is 60s)
#
# IMAGE TAG: PLACEHOLDER_IMAGE_TAG_UNVERIFIED_OFFLINE -- this session could
# not determine the exact image/tag the Minikube `metrics-server` addon is
# currently running (no `kubectl`/`docker` access permitted this phase, and
# no prior report/snapshot in this repo recorded the image digest/tag,
# only the container ARGS). Before this manifest is ever applied, the
# image reference MUST be read live from the cluster
# (`kubectl get deployment metrics-server -n kube-system -o
# jsonpath='{.spec.template.spec.containers[0].image}'`) and substituted
# here, so the self-managed Deployment runs the IDENTICAL image the addon
# was already running -- never a different upstream version chosen without
# evidence. See this phase's report for this exact, disclosed gap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:metrics-server
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    k8s-app: metrics-server
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
  selector:
    k8s-app: metrics-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    k8s-app: metrics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: metrics-server
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      serviceAccountName: metrics-server
      containers:
        - name: metrics-server
          # PLACEHOLDER -- see header comment above. Must be replaced with
          # the exact live image/tag read from the existing addon
          # Deployment before this manifest is applied.
          image: "PLACEHOLDER_IMAGE_TAG_UNVERIFIED_OFFLINE"
          args:
            - --cert-dir=/tmp
            - --secure-port=4443
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --kubelet-use-node-status-port
            - --kubelet-insecure-tls
            - --metric-resolution=15s
          ports:
            - name: https
              containerPort: 4443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  service:
    name: metrics-server
    namespace: kube-system
  group: metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
