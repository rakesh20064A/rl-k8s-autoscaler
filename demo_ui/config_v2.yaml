# demo_ui/config_v2.yaml
# V2 Phase 5D (post-training): settings for the demo UI's V2
# (multi-metric autoscaler) support. Read by demo_ui/config_v2.py. Paths
# are relative to the repo root unless absolute.
#
# model_path: the FINAL trained V2 model checkpoint -- session_047, the
# last of the 48 completed final_min2 sessions (12,288/12,288 timesteps).
model_path: "persistent-data/rl_training_v2/final_min2/sessions/session_047/ppo_model.zip"

# epsilon_calibration_path: the OFFICIAL epsilon calibration record
# (scripts/calibrate_epsilon_v2.py --official, run against session_047 +
# the last 5 sessions; epsilon=0.05, capped).
epsilon_calibration_path: "persistent-data/rl_training_v2/final_min2/EPSILON_CALIBRATION.json"

# evaluation_campaign_dir: the live evaluation campaign folder the
# Comparison (V2) view reads from. Will exist once
# scripts/evaluate_v2_campaign.py --execute --campaign-id eval_final
# has run (launched this phase).
evaluation_campaign_dir: "persistent-data/evaluation_v2/eval_final"
